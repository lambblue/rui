<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUI: Real User Instruction — Interactive Demo</title>
    <meta name="description"
        content="Interactive demo of Real User Instruction (RUI), a prompt-level defense against Indirect Prompt Injection for LLM agents.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Top Navigation -->
    <header id="navbar">
        <div class="nav-left">
            <i class="fa-solid fa-shield-halved nav-logo-icon"></i>
            <span class="nav-title">RUI <span class="nav-badge">Real User Instruction</span></span>
        </div>
        <div class="nav-right">
            <button class="btn btn-ghost" id="btn-toggle-config">
                <i class="fa-solid fa-gear"></i> Config
            </button>
        </div>
    </header>

    <!-- Collapsible Config Panel -->
    <section id="config-panel" class="config-panel hidden">
        <div class="config-inner">
            <div class="config-field">
                <label for="api-provider">Provider</label>
                <select id="api-provider">
                    <option value="openai">OpenAI</option>
                    <option value="openrouter">OpenRouter</option>
                    <option value="ollama">Ollama (Local)</option>
                </select>
            </div>
            <div class="config-field">
                <label for="api-url">Base URL</label>
                <input type="text" id="api-url" value="https://api.openai.com/v1">
            </div>
            <div class="config-field">
                <label for="api-key">API Key</label>
                <div class="key-input-wrap">
                    <input type="password" id="api-key" placeholder="sk-...">
                    <button type="button" id="btn-toggle-key" class="btn-icon"><i
                            class="fa-regular fa-eye"></i></button>
                </div>
            </div>
            <div class="config-field">
                <label for="api-model">Model</label>
                <input type="text" id="api-model" value="gpt-4o-mini">
            </div>
            <div class="config-field">
                <label for="api-reasoning-effort">Reasoning Effort</label>
                <select id="api-reasoning-effort">
                    <option value="none">None (Standard)</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            <div class="config-field config-status">
                <span id="api-status" class="status-dot"><span class="dot"></span> Ready</span>
            </div>
        </div>
    </section>

    <main id="app">
        <!-- Input Section -->
        <section class="input-section">
            <div class="input-card glass-card">
                <div class="input-header">
                    <h2>New Turn Input</h2>
                    <div class="input-actions">
                        <button class="btn btn-ghost btn-sm" id="btn-load-sample"><i class="fa-solid fa-flask"></i> Load
                            Sample</button>
                        <button class="btn btn-ghost btn-sm" id="btn-clear"><i class="fa-solid fa-trash-can"></i> Reset
                            All</button>
                    </div>
                </div>
                <div class="input-grid">
                    <div class="field">
                        <label for="sys-prompt">System Prompt</label>
                        <textarea id="sys-prompt" rows="2" placeholder="You are a helpful assistant..."></textarea>
                    </div>
                    <div class="field">
                        <label for="user-instruction">User Instruction</label>
                        <textarea id="user-instruction" rows="2"
                            placeholder="The legitimate user command..."></textarea>
                    </div>
                    <div class="field">
                        <label for="data-payload">Data Payload <span class="label-hint">(untrusted external
                                data)</span></label>
                        <textarea id="data-payload" rows="2"
                            placeholder="External data retrieved by the agent..."></textarea>
                    </div>
                    <div class="field field-injection">
                        <label for="injection-payload">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            Injection <span class="label-hint">(appended to data payload)</span>
                        </label>
                        <textarea id="injection-payload" rows="2"
                            placeholder="Simulated adversarial injection..."></textarea>
                    </div>
                </div>
                <div class="input-footer">
                    <button class="btn btn-accent btn-lg" id="btn-run">
                        <i class="fa-solid fa-play"></i> Execute Turn
                    </button>
                    <p class="hint">Runs both undefended and RUI-protected calls side-by-side for comparison.</p>
                </div>
            </div>
        </section>

        <!-- Conversation Timeline -->
        <section id="timeline" class="timeline-section">
            <div class="timeline-empty" id="timeline-empty">
                <i class="fa-regular fa-comments"></i>
                <p>No turns yet. Configure your inputs above and click <strong>Execute Turn</strong> to begin.</p>
            </div>
        </section>
    </main>

    <footer id="footer">
        <p>RUI Framework &middot; <a href="https://github.com">GitHub</a></p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
